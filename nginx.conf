worker_processes auto;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Rakazo uses root-level client routes. Only iframe navigations are sent to
    # Workforce, so Ekvaar's own /app remains the top-level OS entry point.
    map $http_sec_fetch_dest $app_shell_upstream {
        default frontend:3000;
        iframe  rakazo-web:5173;
    }

    server {
        listen 80;
        server_name commerce.abata.tech www.commerce.abata.tech app.commerce.abata.tech;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name commerce.abata.tech www.commerce.abata.tech app.commerce.abata.tech;

        ssl_certificate /etc/ssl/ekvaar/cert.pem;
        ssl_certificate_key /etc/ssl/ekvaar/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;

        # Docker's embedded DNS — re-resolve service hostnames instead of caching
        # the IP for nginx's whole lifetime. Without this, recreating just the
        # `frontend`/`fastapi` container (not nginx) during a rolling deploy leaves
        # nginx stuck proxying to the old container's now-dead IP.
        resolver 127.0.0.11 valid=10s;

        # Same-origin Workforce bootstrap. Rakazo is intentionally isolated in
        # an iframe while sharing this TLS endpoint, avoiding another DNS name
        # and keeping credentials off the browser-visible Ekvaar API.
        location = /workforce {
            return 308 /workforce/;
        }

        location /workforce/ {
            auth_request /api/workforce/authorize;
            set $rakazo_web_upstream rakazo-web:5173;
            proxy_pass http://$rakazo_web_upstream/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Accept-Encoding "";
            proxy_hide_header X-Frame-Options;
            sub_filter_once on;
            sub_filter '<head>' '<head><script src="/workforce-bridge.js"></script>';
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /workforce-bridge.js {
            auth_request /api/workforce/authorize;
            alias /etc/nginx/workforce-bridge.js;
            default_type application/javascript;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Static bundle and API paths used by the unmodified upstream Rakazo UI.
        location /assets/ {
            set $rakazo_web_upstream rakazo-web:5173;
            proxy_pass http://$rakazo_web_upstream;
            proxy_set_header Host $host;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /rpc {
            auth_request /api/workforce/authorize;
            set $rakazo_web_upstream rakazo-web:5173;
            proxy_pass http://$rakazo_web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }

        location /novnc/ {
            auth_request /api/workforce/authorize;
            set $rakazo_web_upstream rakazo-web:5173;
            proxy_pass http://$rakazo_web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location ~ ^/api/voice/(speak|transcribe)$ {
            auth_request /api/workforce/authorize;
            set $rakazo_web_upstream rakazo-web:5173;
            proxy_pass http://$rakazo_web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            client_max_body_size 25M;
            proxy_read_timeout 300s;
        }

        # Rakazo uses Better Auth's hyphenated endpoints while Ekvaar uses
        # NextAuth's /session, /signin, /signout, /callback and /providers
        # endpoints. Route only the non-overlapping Better Auth surface here so
        # the unmodified Rakazo client can bootstrap without a fragile fetch
        # monkeypatch inside the iframe.
        location ~ ^/api/auth/(get-session|sign-in/|sign-up/|sign-out$|organization/) {
            auth_request /api/workforce/authorize;
            set $rakazo_web_upstream rakazo-web:5173;
            proxy_pass http://$rakazo_web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 15s;
            proxy_send_timeout 200s;
            proxy_read_timeout 200s;
        }

        # Keep the explicit namespace available for future Workforce-only
        # callbacks and integrations without colliding with Ekvaar auth.
        location /workforce-api/auth/ {
            auth_request /api/workforce/authorize;
            rewrite ^/workforce-api/auth/(.*)$ /api/auth/$1 break;
            set $rakazo_web_upstream rakazo-web:5173;
            proxy_pass http://$rakazo_web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 15s;
            proxy_send_timeout 200s;
            proxy_read_timeout 200s;
        }

        # Bot webhooks are authenticated by Rakazo's per-bot secret and must
        # remain callable by external automation providers.
        location ~ ^/api/v1/bots/[^/]+/webhook$ {
            set $rakazo_web_upstream rakazo-web:5173;
            proxy_pass http://$rakazo_web_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            client_max_body_size 10M;
            proxy_read_timeout 300s;
        }

        # BrowserRouter refreshes inside the iframe must return Rakazo's SPA;
        # normal top-level requests still resolve to the Ekvaar frontend.
        location ~ ^/(app(?:/.*)?|sign-in|sign-up|onboarding)$ {
            set $selected_shell_upstream $app_shell_upstream;
            proxy_pass http://$selected_shell_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header X-Frame-Options;
            add_header X-Frame-Options "SAMEORIGIN" always;
        }

        location = /mcp/oauth/callback {
            set $rakazo_web_upstream rakazo-web:5173;
            proxy_pass http://$rakazo_web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto https;
        }

        location / {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Self-hosted n8n editor and webhooks. Authentication is owned by n8n;
        # the service itself is not published on a host port.
        location /automation/ {
            set $n8n_upstream n8n:5678;
            proxy_pass http://$n8n_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }

        # Jarvis TTS/STT/voices → FastAPI (edge-tts + faster-whisper)
        location ~ ^/api/jarvis/(tts|stt|voices)(/|$) {
            set $fastapi_upstream fastapi:8000;
            proxy_pass http://$fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60;
            client_max_body_size 10M;
        }

        # Everything else under /api/ (including /api/auth/) is Next.js/Prisma —
        # backend-py only serves /api/jarvis/* now, everything else it used to
        # own has either been ported to Next.js or deleted as dead code.
        location /api/ {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 15s;
            proxy_send_timeout 200s;
            proxy_read_timeout 200s;
        }
    }
}
