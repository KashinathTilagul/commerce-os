worker_processes auto;

events { worker_connections 1024; }

http {
    include mime.types;
    default_type application/octet-stream;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    server {
        listen 80;
        server_name os.ekvaar.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name os.ekvaar.com;

        ssl_certificate /etc/ssl/ekvaar/cert.pem;
        ssl_certificate_key /etc/ssl/ekvaar/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;

        # Docker's embedded DNS — re-resolve service hostnames instead of caching
        # the IP for nginx's whole lifetime. Without this, recreating just the
        # `frontend`/`fastapi` container (not nginx) during a rolling deploy leaves
        # nginx stuck proxying to the old container's now-dead IP.
        resolver 127.0.0.11 valid=10s;

        location / {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Jarvis TTS/STT/voices → FastAPI (edge-tts + faster-whisper)
        location ~ ^/api/jarvis/(tts|stt|voices)(/|$) {
            set $fastapi_upstream fastapi:8000;
            proxy_pass http://$fastapi_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 60;
            client_max_body_size 10M;
        }

        # Everything else under /api/ (including /api/auth/) is Next.js/Prisma —
        # backend-py only serves /api/jarvis/* now, everything else it used to
        # own has either been ported to Next.js or deleted as dead code.
        location /api/ {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
