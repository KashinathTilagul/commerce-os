name: Apply Digital Employees Roster (manual)

on:
  workflow_dispatch: {}

jobs:
  apply-roster:
    # Self-hosted (same runner as deploy.yml, already on the target box) —
    # ubuntu-latest jobs are blocked whenever GitHub Actions billing has an
    # issue; this avoids that entirely and drops the redundant SSH hop.
    runs-on: self-hosted
    steps:
      - name: Run apply-roster.ts
        run: |
          set -e -o pipefail
          cd /home/ubuntu/Ekvaar 2>/dev/null || cd /home/ubuntu/EKVAAR 2>/dev/null || { echo "[x] Repo directory not found"; exit 1; }
          docker compose exec -T frontend npx tsx scripts/apply-roster.ts
