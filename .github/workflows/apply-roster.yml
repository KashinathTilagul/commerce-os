name: Apply Digital Employees Roster (manual)

on:
  workflow_dispatch: {}

jobs:
  apply-roster:
    runs-on: ubuntu-latest
    steps:
      - name: Run apply-roster.ts on AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            set -e -o pipefail
            cd ~/Ekvaar 2>/dev/null || cd ~/EKVAAR 2>/dev/null || { echo "[✗] Repo directory not found"; exit 1; }
            docker compose exec -T frontend npx tsx scripts/apply-roster.ts
