name: Apply Digital Employees Roster (manual)

on:
  workflow_dispatch: {}

jobs:
  apply-roster:
    # Self-hosted (same runner as deploy.yml, already on the target box) —
    # ubuntu-latest jobs are blocked whenever GitHub Actions billing has an
    # issue; this avoids that entirely and drops the redundant SSH hop.
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Run apply-roster.ts
        run: |
          set -e -o pipefail
          cd /home/ubuntu/Ekvaar 2>/dev/null || cd /home/ubuntu/EKVAAR 2>/dev/null || { echo "[x] Repo directory not found"; exit 1; }
          # ponytail: `npx tsx` re-resolves/installs tsx from the registry on
          # every single run since it wasn't a real dependency — any registry
          # hiccup inside the container hung this indefinitely and jammed the
          # whole runner queue behind it. tsx is now a real devDependency
          # (baked into the image), so call its binary directly.
          timeout 120 docker compose exec -T frontend node node_modules/.bin/tsx scripts/apply-roster.ts
