name: Apply Digital Employees Roster (manual)

on:
  workflow_dispatch: {}

jobs:
  apply-roster:
    # Self-hosted (same runner as deploy.yml, already on the target box) —
    # ubuntu-latest jobs are blocked whenever GitHub Actions billing has an
    # issue; this avoids that entirely and drops the redundant SSH hop.
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - name: Apply roster through the protected API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e -o pipefail
          [ -n "$CRON_SECRET" ] || { echo "[x] CRON_SECRET is not configured"; exit 1; }
          curl -fskS --max-time 480 --retry 3 \
            -X POST \
            -H "Host: os.ekvaar.com" \
            -H "x-cron-secret: $CRON_SECRET" \
            https://localhost/api/agents/apply-roster
