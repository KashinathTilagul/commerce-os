name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE_NAME: kashinathtilagul/ekvaar-frontend
  FASTAPI_IMAGE_NAME: kashinathtilagul/ekvaar-fastapi

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FRONTEND_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/backend-py
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.FASTAPI_IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e -o pipefail
            cd ~/Ekvaar || cd ~/EKVAAR || { echo "[✗] Repo directory not found"; exit 1; }
            echo "[i] Deploying from: $(pwd)"
            git pull origin main
            
            # Login to GHCR to pull the private images
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Create .env file from GitHub Secrets
            cat > .env << 'ENVEOF'
            DATABASE_URL=file:/app/db/custom.db
            NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}
            NEXTAUTH_URL=https://os.ekvaar.com
            GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
            GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
            COMPOSIO_API_KEY=${{ secrets.COMPOSIO_API_KEY }}
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            AWS_REGION=us-east-1
            BEDROCK_MODEL_ID=amazon.nova-pro-v1:0
            SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
            SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
            SPOTIFY_REDIRECT_URI=${{ secrets.SPOTIFY_REDIRECT_URI }}
            ENVEOF
            
            # Ensure images are updated before restart
            docker compose pull frontend fastapi
            
            # Restart containers
            docker compose up -d fastapi frontend
            docker compose restart nginx
            
            # Cleanup old unused images
            docker image prune -f || true
            
            sleep 8
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://os.ekvaar.com)
            [ "$STATUS" -lt 500 ] || { echo "[✗] Health check failed: HTTP $STATUS"; exit 1; }
            echo "[✓] Deployed OK (HTTP $STATUS)"
