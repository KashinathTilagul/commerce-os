name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          command_timeout: 30m
          script: |
            set -e -o pipefail
            cd ~/Ekvaar || cd ~/EKVAAR || { echo "[✗] Repo directory not found (tried ~/Ekvaar and ~/EKVAAR)"; exit 1; }
            echo "[i] Deploying from: $(pwd)"
            git pull origin main
            echo "[i] Now at commit: $(git rev-parse --short HEAD) — $(git log -1 --format=%s)"
            docker builder prune -f || true
            docker image prune -af || true
            sudo docker compose up -d --build fastapi frontend
            sudo docker compose restart nginx
            docker image prune -f || true
            sleep 8
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://os.ekvaar.com)
            [ "$STATUS" -lt 500 ] || { echo "[✗] Health check failed: HTTP $STATUS"; exit 1; }
            echo "[✓] Deployed OK (HTTP $STATUS)"
