name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Never run two deploys at once — they race on the same Docker Compose project
# and tear down each other's containers. Let the running one finish; a newer
# push waits and supersedes any other queued run.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          command_timeout: 60m
          envs: NEXTAUTH_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,COMPOSIO_API_KEY,OPENROUTER_API_KEY,GROQ_API_KEY,JWT_SECRET,SPOTIFY_CLIENT_ID,SPOTIFY_CLIENT_SECRET,SPOTIFY_REDIRECT_URI
          script: |
            set -e -o pipefail
            cd ~/Ekvaar 2>/dev/null || cd ~/EKVAAR 2>/dev/null || { echo "[x] Repo directory not found"; exit 1; }
            echo "[i] Deploying from: $(pwd)"
            git pull origin main
            echo "[i] Now at commit: $(git rev-parse --short HEAD)"

            printf '%s\n' \
              "DATABASE_URL=file:///app/db/custom.db" \
              "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}" \
              "NEXTAUTH_URL=https://os.ekvaar.com" \
              "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
              "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
              "COMPOSIO_API_KEY=${COMPOSIO_API_KEY}" \
              "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}" \
              "GROQ_API_KEY=${GROQ_API_KEY}" \
              "JWT_SECRET=${JWT_SECRET}" \
              "AWS_REGION=us-east-1" \
              "BEDROCK_MODEL_ID=amazon.nova-pro-v1:0" \
              "SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}" \
              "SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}" \
              "SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}" \
              > .env

            echo "[i] Disk before cleanup:"; df -h / || true

            # Reclaim space WITHOUT stopping the running site (dangling images,
            # stopped containers, build cache) — old containers keep serving
            sudo docker image prune -f || true
            sudo docker container prune -f || true
            sudo docker builder prune -f --keep-storage 2GB || true
            sudo apt-get clean || true
            sudo journalctl --vacuum-size=100M || true
            echo "[i] Disk after cleanup:"; df -h / || true

            # Build while old containers still serve traffic (zero downtime
            # during the slow part). Layer cache stays valid; git pull already
            # invalidates changed layers.
            sudo docker compose build --progress=plain 2>&1

            # Swap: recreates only changed containers — seconds, not minutes
            sudo docker compose up -d

            # Now that old containers are replaced, drop their images
            sudo docker image prune -af || true

            # Health check the app DIRECTLY on localhost — the public URL goes
            # through Cloudflare, whose WAF 403s curl and masks a dead origin
            # Up to ~3 min — a cold container on this small box can be slow to
            # boot, and after a prior failed deploy there may be no old one serving
            for i in $(seq 1 36); do
              STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 5 -H "Host: os.ekvaar.com" https://localhost/api/health || echo 000)
              [ "$STATUS" = "200" ] && break
              echo "[i] Waiting for app... attempt $i (HTTP $STATUS)"
              sleep 5
            done
            if [ "$STATUS" != "200" ]; then
              echo "[x] App failed to start (HTTP $STATUS). Container logs:"
              sudo docker compose logs --tail 100
              exit 1
            fi
            echo "[ok] Deployed OK (HTTP $STATUS)"
