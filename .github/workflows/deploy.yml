name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-workforce-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and publish Workforce images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          COMPUTER_IMAGE: ghcr.io/kashinathtilagul/ekvaar/rakazo-computer:${{ github.sha }}
          APP_IMAGE: ghcr.io/kashinathtilagul/ekvaar/rakazo-app:${{ github.sha }}
        run: |
          set -e -o pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          docker build \
            --file infra/rakazo/Dockerfile.computer \
            --tag "$COMPUTER_IMAGE" \
            .
          docker push "$COMPUTER_IMAGE"
          docker build \
            --file infra/rakazo/Dockerfile.app \
            --tag "$APP_IMAGE" \
            .
          docker push "$APP_IMAGE"
          docker run --rm "$APP_IMAGE" test -f /app/api/src/index.ts
          docker run --rm "$APP_IMAGE" test -f /app/web-runtime/dist/index.html
          web_container=$(docker run -d \
            -e SCREEN_PROXY_SECRET=0123456789abcdef0123456789abcdef \
            -e RAKAZO_HOST=127.0.0.1 \
            -p 127.0.0.1:5173:5173 \
            "$APP_IMAGE" \
            /app/web-runtime/node_modules/.bin/vite preview \
            --config /app/web-runtime/vite.runtime.config.ts)
          for attempt in $(seq 1 20); do
            curl -fsS http://127.0.0.1:5173/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:5173/ >/dev/null || {
            docker logs "$web_container"
            exit 1
          }
          docker rm -f "$web_container"

  deploy:
    needs: build-workforce-images
    runs-on: self-hosted

    steps:
      - name: Deploy
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          ARTIFACT_SIGNING_SECRET: ${{ secrets.ARTIFACT_SIGNING_SECRET }}
          N8N_ENCRYPTION_KEY: ${{ secrets.N8N_ENCRYPTION_KEY }}
          OPEN_DESIGN_API_TOKEN: ${{ secrets.OPEN_DESIGN_API_TOKEN }}
          COGNEE_LLM_API_KEY: ${{ secrets.COGNEE_LLM_API_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
          QIKINK_MODE: ${{ secrets.QIKINK_MODE }}
          QIKINK_CLIENT_ID: ${{ secrets.QIKINK_CLIENT_ID }}
          QIKINK_CLIENT_SECRET: ${{ secrets.QIKINK_CLIENT_SECRET }}
          BROWSER_WORKER_KEY: ${{ secrets.BROWSER_WORKER_KEY }}
          BROWSER_SIDECAR_URL: ${{ secrets.BROWSER_SIDECAR_URL }}
          BROWSER_USE_API_KEY: ${{ secrets.BROWSER_USE_API_KEY }}
          BROWSER_USE_MODEL: ${{ secrets.BROWSER_USE_MODEL }}
          OPENAI_BROWSER_MODEL: ${{ secrets.OPENAI_BROWSER_MODEL }}
          META_CLIENT_ID: ${{ secrets.META_CLIENT_ID }}
          META_CLIENT_SECRET: ${{ secrets.META_CLIENT_SECRET }}
          THREADS_CLIENT_ID: ${{ secrets.THREADS_CLIENT_ID }}
          THREADS_CLIENT_SECRET: ${{ secrets.THREADS_CLIENT_SECRET }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          N8N_EKVAAR_WEBHOOK_URL: ${{ secrets.N8N_EKVAAR_WEBHOOK_URL }}
          N8N_EKVAAR_WEBHOOK_SECRET: ${{ secrets.N8N_EKVAAR_WEBHOOK_SECRET }}
          N8N_EKVAAR_WORKFLOW_ID: ${{ secrets.N8N_EKVAAR_WORKFLOW_ID }}
          N8N_EKVAAR_EDITOR_URL: ${{ secrets.N8N_EKVAAR_EDITOR_URL }}
          E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          BOX_API_KEY: ${{ secrets.BOX_API_KEY }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          DOCKER_BUILDKIT: 1
        run: |
          set -e -o pipefail
          export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
          cd /home/ubuntu/Ekvaar 2>/dev/null || cd /home/ubuntu/EKVAAR 2>/dev/null || { echo "[x] Repo directory not found"; exit 1; }
          echo "[i] Deploying from: $(pwd)"
          git fetch --prune origin main
          git checkout -B main origin/main
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
          echo "[i] Now at commit: $(git rev-parse --short HEAD)"

          if [ $(/usr/sbin/swapon --show | wc -l) -eq 0 ]; then
            echo "[i] Enabling 2GB swap space to prevent OOM build crashes..."
            /usr/bin/sudo fallocate -l 2G /swapfile || /usr/bin/sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
            /usr/bin/sudo chmod 600 /swapfile
            /usr/bin/sudo mkswap /swapfile || true
            /usr/bin/sudo swapon /swapfile || true
          fi

          mkdir -p db apps/frontend/db
          /usr/bin/sudo chmod -R 777 db apps/frontend/db 2>/dev/null || true

          existing_env() {
            [ -f .env ] && grep -m1 "^$1=" .env | cut -d= -f2- || true
          }

          persisted_or_generated() {
            local name="$1"
            local supplied="${!name:-}"
            local persisted
            persisted="$(existing_env "$name")"
            if [ -n "$supplied" ]; then
              printf '%s' "$supplied"
            elif [ -n "$persisted" ]; then
              printf '%s' "$persisted"
            else
              openssl rand -hex 32
            fi
          }

          persisted_or_generated_min_length() {
            local name="$1"
            local minimum="$2"
            local value
            value="$(persisted_or_generated "$name")"
            if [ "${#value}" -lt "$minimum" ]; then
              echo "[i] Rotating $name because it does not meet the $minimum-character runtime requirement." >&2
              openssl rand -hex 32
            else
              printf '%s' "$value"
            fi
          }

          DATABASE_URL="${DATABASE_URL:-$(existing_env DATABASE_URL)}"
          DIRECT_URL="${DIRECT_URL:-$(existing_env DIRECT_URL)}"
          if [ -z "$DATABASE_URL" ] || [[ "$DATABASE_URL" != postgresql://* ]]; then
            echo "[x] DATABASE_URL must be set to the Supabase PostgreSQL connection string."
            exit 1
          fi

          # Normalize legacy direct URLs to the IPv4 Supabase session pooler.
          if [[ "$DATABASE_URL" == postgresql://postgres:*@db.guxaxhofeglqkmrhahsw.supabase.co:5432/* ]]; then
            DATABASE_URL="postgresql://postgres.guxaxhofeglqkmrhahsw:${DATABASE_URL#postgresql://postgres:}"
            DATABASE_URL="${DATABASE_URL/@db.guxaxhofeglqkmrhahsw.supabase.co:5432/@aws-0-ap-south-1.pooler.supabase.com:5432}"
          fi
          if [[ "$DATABASE_URL" == postgresql://postgres:*@aws-0-ap-south-1.pooler.supabase.com:5432/* ]]; then
            DATABASE_URL="postgresql://postgres.guxaxhofeglqkmrhahsw:${DATABASE_URL#postgresql://postgres:}"
          fi

          # Prisma CLI uses the session pooler; application traffic uses the
          # transaction pooler with prepared statements disabled.
          if [ -z "$DIRECT_URL" ]; then
            DIRECT_URL="$DATABASE_URL"
            DIRECT_URL="${DIRECT_URL/:6543\//:5432/}"
            DIRECT_URL="${DIRECT_URL%%\?*}"
          fi
          if [[ "$DATABASE_URL" == *"pooler.supabase.com:5432/"* ]]; then
            DATABASE_URL="${DATABASE_URL/:5432\//:6543/}"
          fi
          if [[ "$DATABASE_URL" == *":6543/"* ]] && [[ "$DATABASE_URL" != *"pgbouncer=true"* ]]; then
            if [[ "$DATABASE_URL" == *"?"* ]]; then
              DATABASE_URL="${DATABASE_URL}&pgbouncer=true&connection_limit=5"
            else
              DATABASE_URL="${DATABASE_URL}?pgbouncer=true&connection_limit=5"
            fi
          fi

          NEXTAUTH_SECRET="$(persisted_or_generated NEXTAUTH_SECRET)"
          JWT_SECRET="$(persisted_or_generated JWT_SECRET)"
          CRON_SECRET="$(persisted_or_generated CRON_SECRET)"
          ARTIFACT_SIGNING_SECRET="$(persisted_or_generated ARTIFACT_SIGNING_SECRET)"
          N8N_ENCRYPTION_KEY="$(persisted_or_generated N8N_ENCRYPTION_KEY)"
          N8N_EKVAAR_WEBHOOK_SECRET="$(persisted_or_generated N8N_EKVAAR_WEBHOOK_SECRET)"
          OPEN_DESIGN_API_TOKEN="$(persisted_or_generated OPEN_DESIGN_API_TOKEN)"
          COGNEE_LLM_API_KEY="$(persisted_or_generated COGNEE_LLM_API_KEY)"
          RAKAZO_POSTGRES_PASSWORD="$(persisted_or_generated RAKAZO_POSTGRES_PASSWORD)"
          RAKAZO_BETTER_AUTH_SECRET="$(persisted_or_generated_min_length RAKAZO_BETTER_AUTH_SECRET 32)"
          RAKAZO_ENCRYPTION_KEY="$(persisted_or_generated RAKAZO_ENCRYPTION_KEY)"
          RAKAZO_SCREEN_PROXY_SECRET="$(persisted_or_generated_min_length RAKAZO_SCREEN_PROXY_SECRET 32)"
          RAKAZO_SANDBOX_SUPERVISOR_TOKEN="$(persisted_or_generated_min_length RAKAZO_SANDBOX_SUPERVISOR_TOKEN 32)"

          GOOGLE_CLIENT_ID="${GOOGLE_CLIENT_ID:-$(existing_env GOOGLE_CLIENT_ID)}"
          GOOGLE_CLIENT_SECRET="${GOOGLE_CLIENT_SECRET:-$(existing_env GOOGLE_CLIENT_SECRET)}"
          SPOTIFY_CLIENT_ID="${SPOTIFY_CLIENT_ID:-$(existing_env SPOTIFY_CLIENT_ID)}"
          SPOTIFY_CLIENT_SECRET="${SPOTIFY_CLIENT_SECRET:-$(existing_env SPOTIFY_CLIENT_SECRET)}"
          SPOTIFY_REDIRECT_URI="${SPOTIFY_REDIRECT_URI:-$(existing_env SPOTIFY_REDIRECT_URI)}"
          QIKINK_MODE="${QIKINK_MODE:-$(existing_env QIKINK_MODE)}"
          QIKINK_CLIENT_ID="${QIKINK_CLIENT_ID:-$(existing_env QIKINK_CLIENT_ID)}"
          QIKINK_CLIENT_SECRET="${QIKINK_CLIENT_SECRET:-$(existing_env QIKINK_CLIENT_SECRET)}"
          BROWSER_WORKER_KEY="${BROWSER_WORKER_KEY:-$(existing_env BROWSER_WORKER_KEY)}"
          BROWSER_SIDECAR_URL="${BROWSER_SIDECAR_URL:-$(existing_env BROWSER_SIDECAR_URL)}"
          BROWSER_USE_API_KEY="${BROWSER_USE_API_KEY:-$(existing_env BROWSER_USE_API_KEY)}"
          BROWSER_USE_MODEL="${BROWSER_USE_MODEL:-$(existing_env BROWSER_USE_MODEL)}"
          OPENAI_BROWSER_MODEL="${OPENAI_BROWSER_MODEL:-$(existing_env OPENAI_BROWSER_MODEL)}"
          META_CLIENT_ID="${META_CLIENT_ID:-$(existing_env META_CLIENT_ID)}"
          META_CLIENT_SECRET="${META_CLIENT_SECRET:-$(existing_env META_CLIENT_SECRET)}"
          THREADS_CLIENT_ID="${THREADS_CLIENT_ID:-$(existing_env THREADS_CLIENT_ID)}"
          THREADS_CLIENT_SECRET="${THREADS_CLIENT_SECRET:-$(existing_env THREADS_CLIENT_SECRET)}"
          LINKEDIN_CLIENT_ID="${LINKEDIN_CLIENT_ID:-$(existing_env LINKEDIN_CLIENT_ID)}"
          LINKEDIN_CLIENT_SECRET="${LINKEDIN_CLIENT_SECRET:-$(existing_env LINKEDIN_CLIENT_SECRET)}"
          N8N_EKVAAR_WEBHOOK_URL="${N8N_EKVAAR_WEBHOOK_URL:-$(existing_env N8N_EKVAAR_WEBHOOK_URL)}"
          N8N_EKVAAR_WORKFLOW_ID="${N8N_EKVAAR_WORKFLOW_ID:-$(existing_env N8N_EKVAAR_WORKFLOW_ID)}"
          N8N_EKVAAR_EDITOR_URL="${N8N_EKVAAR_EDITOR_URL:-$(existing_env N8N_EKVAAR_EDITOR_URL)}"
          E2B_API_KEY="${E2B_API_KEY:-$(existing_env E2B_API_KEY)}"
          DAYTONA_API_KEY="${DAYTONA_API_KEY:-$(existing_env DAYTONA_API_KEY)}"
          BOX_API_KEY="${BOX_API_KEY:-$(existing_env BOX_API_KEY)}"
          RELEASE_VERSION="$(git rev-parse --short HEAD)"

          printf '%s\n' \
            "DATABASE_URL=${DATABASE_URL}" \
            "DIRECT_URL=${DIRECT_URL}" \
            "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}" \
            "NEXTAUTH_URL=https://os.ekvaar.com" \
            "NEXT_PUBLIC_APP_URL=https://os.ekvaar.com" \
            "ARTIFACT_SIGNING_SECRET=${ARTIFACT_SIGNING_SECRET}" \
            "CAMPAIGN_LAUNCHES_ENABLED=true" \
            "RELEASE_VERSION=${RELEASE_VERSION}" \
            "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
            "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
            "JWT_SECRET=${JWT_SECRET}" \
            "CRON_SECRET=${CRON_SECRET}" \
            "AWS_REGION=us-east-1" \
            "BEDROCK_MODEL_ID=amazon.nova-pro-v1:0" \
            "META_CLIENT_ID=${META_CLIENT_ID}" \
            "META_CLIENT_SECRET=${META_CLIENT_SECRET}" \
            "META_GRAPH_VERSION=v25.0" \
            "THREADS_CLIENT_ID=${THREADS_CLIENT_ID}" \
            "THREADS_CLIENT_SECRET=${THREADS_CLIENT_SECRET}" \
            "LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}" \
            "LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}" \
            "LINKEDIN_API_VERSION=202606" \
            "SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}" \
            "SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}" \
            "SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}" \
            "QIKINK_MODE=${QIKINK_MODE:-sandbox}" \
            "QIKINK_CLIENT_ID=${QIKINK_CLIENT_ID}" \
            "QIKINK_CLIENT_SECRET=${QIKINK_CLIENT_SECRET}" \
            "BROWSER_WORKER_KEY=${BROWSER_WORKER_KEY}" \
            "BROWSER_SIDECAR_URL=${BROWSER_SIDECAR_URL:-http://fastapi:8000}" \
            "BROWSER_USE_API_KEY=${BROWSER_USE_API_KEY}" \
            "BROWSER_USE_MODEL=${BROWSER_USE_MODEL}" \
            "OPENAI_BROWSER_MODEL=${OPENAI_BROWSER_MODEL}" \
            "N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}" \
            "N8N_HOST=os.ekvaar.com" \
            "N8N_EDITOR_BASE_URL=https://os.ekvaar.com/automation/" \
            "N8N_WEBHOOK_URL=https://os.ekvaar.com/automation/" \
            "N8N_EKVAAR_WEBHOOK_URL=${N8N_EKVAAR_WEBHOOK_URL:-http://n8n:5678/automation/webhook/ekvaar-marketing}" \
            "N8N_EKVAAR_WEBHOOK_SECRET=${N8N_EKVAAR_WEBHOOK_SECRET}" \
            "N8N_EKVAAR_WORKFLOW_ID=${N8N_EKVAAR_WORKFLOW_ID}" \
            "N8N_EKVAAR_EDITOR_URL=${N8N_EKVAAR_EDITOR_URL:-/automation/}" \
            "OPEN_DESIGN_API_TOKEN=${OPEN_DESIGN_API_TOKEN}" \
            "OPEN_DESIGN_ALLOWED_ORIGINS=https://os.ekvaar.com" \
            "COGNEE_LLM_API_KEY=${COGNEE_LLM_API_KEY}" \
            "COGNEE_LLM_MODEL=openai/auto" \
            "RAKAZO_PUBLIC_URL=/workforce/" \
            "RAKAZO_POSTGRES_PASSWORD=${RAKAZO_POSTGRES_PASSWORD}" \
            "RAKAZO_BETTER_AUTH_SECRET=${RAKAZO_BETTER_AUTH_SECRET}" \
            "RAKAZO_ENCRYPTION_KEY=${RAKAZO_ENCRYPTION_KEY}" \
            "RAKAZO_SCREEN_PROXY_SECRET=${RAKAZO_SCREEN_PROXY_SECRET}" \
            "RAKAZO_SANDBOX_PROVIDER=docker" \
            "RAKAZO_SANDBOX_SUPERVISOR_TOKEN=${RAKAZO_SANDBOX_SUPERVISOR_TOKEN}" \
            "RAKAZO_COMPUTER_IMAGE=ghcr.io/kashinathtilagul/ekvaar/rakazo-computer:${{ github.sha }}" \
            "RAKAZO_APP_IMAGE=ghcr.io/kashinathtilagul/ekvaar/rakazo-app:${{ github.sha }}" \
            "BROWSER_HEADLESS=true" \
            > .env
          chmod 600 .env

          curl -fsS https://supabase-downloads.s3-ap-southeast-1.amazonaws.com/prod/ssl/prod-ca-2021.crt \
            -o db/supabase-ca.crt

          echo "[i] Disk before cleanup:"; df -h / || true

          # The self-hosted runner keeps diagnostic pages forever. They are not
          # deployment artifacts and can themselves prevent the runner from
          # reporting a disk-full failure.
          /usr/bin/sudo find /home/ubuntu/Ekvaar/actions-runner/actions-runner/_diag -type f -mtime +1 -delete 2>/dev/null || true
          # Agent computer containers are disposable runtime shells; their
          # durable homes live in rakazo-app-data. Remove old shells before an
          # image upgrade so they do not pin the superseded computer image.
          MANAGED_COMPUTERS=$(/usr/bin/sudo docker ps -aq --filter label=rakazo.managed=true)
          if [ -n "$MANAGED_COMPUTERS" ]; then
            /usr/bin/sudo docker rm -f $MANAGED_COMPUTERS
          fi
          /usr/bin/sudo docker system prune -af || true
          /usr/bin/sudo apt-get clean || true
          /usr/bin/sudo journalctl --vacuum-size=100M || true
          echo "[i] Disk after cleanup:"; df -h / || true

          # Compose silently fell back to Docker's legacy builder on the host.
          # Its intermediate layers cannot be reclaimed by `docker builder
          # prune`, which left several GB behind between service builds.
          if ! /usr/bin/sudo docker buildx version >/dev/null 2>&1; then
            BUILDX_VERSION=v0.36.1
            BUILDX_SHA256=48af8a397ebd60178778bf63611dbcebe5f5e7a9be90eb9147b24b9587455778
            curl -fsSL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-amd64" \
              -o /tmp/docker-buildx
            printf '%s  %s\n' "$BUILDX_SHA256" /tmp/docker-buildx | sha256sum -c -
            /usr/bin/sudo mkdir -p /usr/local/lib/docker/cli-plugins
            /usr/bin/sudo install -m 0755 /tmp/docker-buildx /usr/local/lib/docker/cli-plugins/docker-buildx
            rm -f /tmp/docker-buildx
          fi
          /usr/bin/sudo docker buildx version

          # The host cannot hold both generations of the large frontend image.
          # Remove only replaceable app containers so their image layers can be
          # reclaimed before the build. Rakazo's Postgres container and both
          # named data volumes remain live and untouched.
          /usr/bin/sudo docker compose stop frontend upskill google-workspace rakazo-api rakazo-worker rakazo-web rakazo-supervisor || true
          /usr/bin/sudo docker compose rm -f frontend upskill google-workspace rakazo-api rakazo-worker rakazo-web rakazo-supervisor || true
          /usr/bin/sudo docker image prune -af || true
          echo "[i] Disk after releasing superseded stateless images:"; df -h / || true

          # The frontend is the largest local image. Build it while free space
          # is at its maximum, then discard its BuildKit cache before building
          # the smaller sidecars. Building every service in one invocation left
          # their caches resident and starved the frontend dependency layer.
          /usr/bin/sudo docker compose --progress=plain build frontend
          /usr/bin/sudo docker builder prune -af || true
          echo "[i] Disk after frontend build:"; df -h / || true

          # Migrate and restore the public OS before optional sidecars or the
          # large Workforce computer image are built. A later build failure
          # must not leave the already-validated frontend offline.
          /usr/bin/sudo docker compose run --rm --no-deps frontend sh /migration/migrate-production.sh
          /usr/bin/sudo docker compose up -d --no-deps frontend
          /usr/bin/sudo docker compose restart nginx

          # A repository-scoped GHCR token cannot read unrelated public GHCR
          # packages such as astral-sh/uv. Use anonymous access for public
          # sidecar bases, then authenticate below only for Ekvaar's private
          # computer image.
          /usr/bin/sudo docker logout ghcr.io || true
          /usr/bin/sudo docker compose --progress=plain build upskill google-workspace 2>&1 || {
            echo "[!] Sidecar build failed once; reclaiming unused build cache and retrying..."
            /usr/bin/sudo docker builder prune -af || true
            echo "[i] Disk before sidecar retry:"; df -h / || true
            /usr/bin/sudo docker compose --progress=plain build upskill google-workspace 2>&1
          }

          # BuildKit cache is no longer needed once images are materialized.
          # Reclaim it before pulling the external service images so the small
          # self-hosted runner does not hit its disk ceiling during extraction.
          /usr/bin/sudo docker builder prune -af || true
          /usr/bin/sudo docker image prune -f || true

          echo "$GHCR_TOKEN" | /usr/bin/sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
          /usr/bin/sudo docker compose pull rakazo-postgres rakazo-data-init rakazo-api
          # These images are individually large during extraction. Building
          # them concurrently exhausted the runner even though the final
          # images fit. Materialize and prune each one before starting the next.
          /usr/bin/sudo docker compose --progress=plain build rakazo-supervisor
          /usr/bin/sudo docker builder prune -af || true
          /usr/bin/sudo docker compose pull rakazo-computer
          echo "[i] Disk before service startup:"; df -h / || true
          AVAILABLE_KB=$(df -Pk / | awk 'NR==2 {print $4}')
          if [ "${AVAILABLE_KB:-0}" -lt 524288 ]; then
            echo "[x] Less than 512MB free after all builds and pulls; refusing a partial production restart."
            /usr/bin/sudo docker system df || true
            exit 1
          fi

          /usr/bin/sudo docker compose up -d --remove-orphans --wait --wait-timeout 180 || {
            echo "[x] A production container failed its health check."
            /usr/bin/sudo docker compose ps
            /usr/bin/sudo docker compose logs --tail 150 rakazo-api rakazo-worker rakazo-web rakazo-supervisor
            exit 1
          }

          /usr/bin/sudo docker compose restart nginx

          /usr/bin/sudo docker image prune -af || true

          for i in $(seq 1 30); do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" --max-time 3 -H "Host: os.ekvaar.com" https://localhost/api/health || echo 000)
            [ "$STATUS" = "200" ] && break
            echo "[i] Waiting for app... attempt $i/30 (HTTP $STATUS)"
            sleep 3
          done

          if [ "$STATUS" != "200" ]; then
            echo "[x] App failed to start (HTTP $STATUS). Container logs:"
            /usr/bin/sudo docker compose logs --tail 150
            exit 1
          fi

          WORKFORCE_STATUS=$(curl -sk -o /tmp/workforce.html -w "%{http_code}" --max-time 5 -H "Host: os.ekvaar.com" https://localhost/workforce/ || echo 000)
          /usr/bin/sudo docker compose exec -T rakazo-web node -e \
            "fetch('http://127.0.0.1:5173/').then(async r=>{const b=await r.text();process.exit(r.ok&&b.includes('<title>Rakazo</title>')?0:1)}).catch(()=>process.exit(1))"
          /usr/bin/sudo docker compose exec -T rakazo-api sh -lc \
            "grep -q 'await verifyModelCredential' /app/api/src/router.ts"
          /usr/bin/sudo docker compose exec -T rakazo-supervisor node -e \
            "fetch('http://127.0.0.1:7091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
          /usr/bin/sudo docker compose logs --tail 40 rakazo-worker | grep -q "rakazo worker ready"
          if [ "$WORKFORCE_STATUS" != "401" ]; then
            echo "[x] Workforce access boundary failed (anonymous HTTP $WORKFORCE_STATUS; expected 401)."
            /usr/bin/sudo docker compose logs --tail 150 rakazo-postgres rakazo-api rakazo-worker rakazo-web nginx
            exit 1
          fi
          echo "[ok] Deployed OS and Workforce (app HTTP $STATUS, anonymous Workforce correctly denied with HTTP $WORKFORCE_STATUS)"
