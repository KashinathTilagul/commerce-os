name: Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REDIRECT_URI: ${{ secrets.SPOTIFY_REDIRECT_URI }}
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: 22
          command_timeout: 60m
          envs: NEXTAUTH_SECRET,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,COMPOSIO_API_KEY,OPENROUTER_API_KEY,GROQ_API_KEY,JWT_SECRET,SPOTIFY_CLIENT_ID,SPOTIFY_CLIENT_SECRET,SPOTIFY_REDIRECT_URI
          script: |
            set -e -o pipefail
            cd ~/Ekvaar 2>/dev/null || cd ~/EKVAAR 2>/dev/null || { echo "[x] Repo directory not found"; exit 1; }
            echo "[i] Deploying from: $(pwd)"
            git pull origin main
            echo "[i] Now at commit: $(git rev-parse --short HEAD)"

            printf '%s\n' \
              "DATABASE_URL=file:///app/db/custom.db" \
              "NEXTAUTH_SECRET=${NEXTAUTH_SECRET}" \
              "NEXTAUTH_URL=https://os.ekvaar.com" \
              "GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}" \
              "GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}" \
              "COMPOSIO_API_KEY=${COMPOSIO_API_KEY}" \
              "OPENROUTER_API_KEY=${OPENROUTER_API_KEY}" \
              "GROQ_API_KEY=${GROQ_API_KEY}" \
              "JWT_SECRET=${JWT_SECRET}" \
              "AWS_REGION=us-east-1" \
              "BEDROCK_MODEL_ID=amazon.nova-pro-v1:0" \
              "SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}" \
              "SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}" \
              "SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}" \
              > .env

            echo "[i] Disk before cleanup:"; df -h / || true

            # Stop running containers so their image layers are no longer pinned
            # and docker system prune can actually reclaim the space
            sudo docker compose down || true

            docker builder prune -af || true
            docker system prune -af || true
            sudo apt-get clean || true
            sudo journalctl --vacuum-size=100M || true
            echo "[i] Disk after cleanup:"; df -h / || true

            sudo docker compose build --no-cache --progress=plain 2>&1
            sudo docker compose up -d

            sleep 15
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 https://os.ekvaar.com)
            [ "$STATUS" -lt 500 ] || { echo "[x] Health check failed: HTTP $STATUS"; exit 1; }
            echo "[ok] Deployed OK (HTTP $STATUS)"
