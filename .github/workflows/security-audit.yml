name: Periodic Engineered Security Audit

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2:00 AM UTC
  workflow_dispatch:

jobs:
  security-audit:
    name: Engineered Security Audit
    # Self-hosted (same runner as deploy.yml) — ubuntu-latest jobs are blocked
    # whenever GitHub Actions billing has an issue.
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Dependency Audit
        run: |
          cd apps/frontend
          npm audit --json > audit-report.json || true
          cat audit-report.json | head -n 30

      - name: Trigger EKVAAR OS Automated Security Scan
        run: |
          curl -X POST "https://os.ekvaar.com/api/events/security" \
            -H "Content-Type: application/json" \
            -H "x-security-token: ${{ secrets.SECURITY_WEBHOOK_SECRET }}" \
            -d '{
              "title": "Automated Weekly CI/CD Dependency & Code Audit",
              "description": "Weekly automated non-AI security check completed successfully via GitHub Actions.",
              "severity": "INFO",
              "affectedPath": "apps/frontend",
              "ruleId": "CICD-AUDIT-001"
            }' || true
