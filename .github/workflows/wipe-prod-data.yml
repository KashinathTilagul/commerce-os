name: Reset Production Tenants (manual)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type RESET-ALL to permanently delete every user, organization, connection record, and tenant-owned object'
        required: true

jobs:
  wipe:
    # Self-hosted (same runner as deploy.yml) — ubuntu-latest jobs are blocked
    # whenever GitHub Actions billing has an issue; this avoids that entirely.
    runs-on: self-hosted
    steps:
      - name: Verify confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "RESET-ALL" ]; then
            echo "[x] Confirmation input must be exactly 'RESET-ALL' — aborting."
            exit 1
          fi

      - name: Reset tenant database
        run: |
            set -e -o pipefail
            cd /home/ubuntu/Ekvaar 2>/dev/null || cd /home/ubuntu/EKVAAR 2>/dev/null || { echo "[✗] Repo directory not found"; exit 1; }
            /usr/bin/sudo docker compose exec -T frontend node node_modules/tsx/dist/cli.mjs scripts/wipe-all-users.ts
