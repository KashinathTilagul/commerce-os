services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    entrypoint: ["/bin/sh", "/opt/ekvaar/init.sh"]
    expose:
      - "5678"
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/init.sh:/opt/ekvaar/init.sh:ro
      - ./n8n/workflows:/opt/ekvaar/workflows:ro
    environment:
      - N8N_HOST=${N8N_HOST:-os.ekvaar.com}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-https}
      - N8N_PATH=/automation/
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-https://os.ekvaar.com/automation/}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-https://os.ekvaar.com/automation/}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY is required}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_UNVERIFIED_PACKAGES_ENABLED=false
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - EKVAAR_OS_INTERNAL_URL=http://frontend:3000
      - CRON_SECRET=${CRON_SECRET}
      - N8N_EKVAAR_WEBHOOK_SECRET=${N8N_EKVAAR_WEBHOOK_SECRET:?N8N_EKVAAR_WEBHOOK_SECRET is required}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5678/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  cognee:
    image: cognee/cognee:main
    expose:
      - "8000"
    volumes:
      - cognee-system:/app/cognee/.cognee_system
      - cognee-data:/app/cognee/.cognee_data
    environment:
      - LLM_API_KEY=${COGNEE_LLM_API_KEY:-ekvaar-internal}
      - LLM_PROVIDER=openai
      - LLM_MODEL=${COGNEE_LLM_MODEL:-openai/auto}
      - LLM_ENDPOINT=http://omniroute:20128/v1
      - EMBEDDING_PROVIDER=fastembed
      - EMBEDDING_MODEL=BAAI/bge-small-en-v1.5
      - EMBEDDING_DIMENSIONS=384
      - ENABLE_BACKEND_ACCESS_CONTROL=false
      - TELEMETRY_DISABLED=true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s
    depends_on:
      omniroute:
        condition: service_healthy
    restart: unless-stopped

  open-design:
    image: ghcr.io/nexu-io/od:latest
    expose:
      - "7456"
    volumes:
      - open-design-data:/app/.od
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=384
      - OD_BIND_HOST=0.0.0.0
      - OD_PORT=7456
      - OD_WEB_PORT=7456
      - OD_API_TOKEN=${OPEN_DESIGN_API_TOKEN:?OPEN_DESIGN_API_TOKEN is required}
      - OD_ALLOWED_ORIGINS=${OPEN_DESIGN_ALLOWED_ORIGINS:-https://os.ekvaar.com}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7456/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  upskill:
    build:
      context: ./infra/upskill
    expose:
      - "8090"
    environment:
      - OPENAI_API_KEY=${UPSKILL_API_KEY:-ekvaar-internal}
      - OPENAI_BASE_URL=http://omniroute:20128/v1
      - UPSKILL_MODEL=${UPSKILL_MODEL:-openai.auto}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      omniroute:
        condition: service_healthy
    restart: unless-stopped

  google-workspace:
    build:
      context: ./infra/google-workspace
    expose:
      - "8091"
    volumes:
      - google-workspace-config:/root/.config/gws
    environment:
      - CRON_SECRET=${CRON_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rakazo-postgres:
    image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
    environment:
      POSTGRES_USER: rakazo
      POSTGRES_PASSWORD: ${RAKAZO_POSTGRES_PASSWORD:?RAKAZO_POSTGRES_PASSWORD is required}
      POSTGRES_DB: rakazo
    volumes:
      - rakazo-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rakazo -d rakazo"]
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  rakazo-data-init:
    image: busybox:1
    command: ["chown", "-R", "1000:1000", "/data"]
    volumes:
      - rakazo-app-data:/data
    restart: "no"

  rakazo-computer:
    image: ${RAKAZO_COMPUTER_IMAGE:-ekvaar/rakazo-computer:local}
    build:
      context: .
      dockerfile: infra/rakazo/Dockerfile.computer
    command: ["true"]
    restart: "no"

  rakazo-supervisor:
    image: ekvaar/rakazo-supervisor:local
    build:
      context: .
      dockerfile: infra/rakazo/Dockerfile.supervisor
    expose:
      - "7091"
    environment:
      - DATA_DIR=/data
      - SUPERVISOR_HOST=0.0.0.0
      - SUPERVISOR_PORT=7091
      - DOCKER_SOCKET=/var/run/docker.sock
      - RAKAZO_COMPUTER_IMAGE=${RAKAZO_COMPUTER_IMAGE:-ekvaar/rakazo-computer:local}
      - SANDBOX_SUPERVISOR_TOKEN=${RAKAZO_SANDBOX_SUPERVISOR_TOKEN:?RAKAZO_SANDBOX_SUPERVISOR_TOKEN is required}
      - SANDBOX_SCREEN_NETWORK=isolated
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - rakazo-app-data:/data
    depends_on:
      rakazo-computer:
        condition: service_completed_successfully
      rakazo-data-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7091/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  rakazo-api:
    build:
      context: .
      dockerfile: infra/rakazo/Dockerfile.app
    image: ${RAKAZO_APP_IMAGE:-ekvaar/rakazo-app:local}
    command:
      - bash
      - -lc
      - cd /app/api/node_modules/@rakazo/db && node /app/api/node_modules/prisma/build/index.js migrate deploy && exec tsx /app/api/src/index.ts
    expose:
      - "3100"
    environment:
      - NODE_ENV=production
      - API_HOST=0.0.0.0
      - DATABASE_URL=postgres://rakazo:${RAKAZO_POSTGRES_PASSWORD:?RAKAZO_POSTGRES_PASSWORD is required}@rakazo-postgres:5432/rakazo
      - DATA_DIR=/data
      - BETTER_AUTH_URL=https://os.ekvaar.com
      - WEB_ORIGIN=https://os.ekvaar.com
      - BETTER_AUTH_SECRET=${RAKAZO_BETTER_AUTH_SECRET:?RAKAZO_BETTER_AUTH_SECRET is required}
      - ENCRYPTION_KEY=${RAKAZO_ENCRYPTION_KEY:?RAKAZO_ENCRYPTION_KEY is required}
      - SCREEN_PROXY_SECRET=${RAKAZO_SCREEN_PROXY_SECRET:?RAKAZO_SCREEN_PROXY_SECRET is required}
      - SANDBOX_PROVIDER=docker
      - SANDBOX_SUPERVISOR_URL=http://rakazo-supervisor:7091
      - SANDBOX_SUPERVISOR_TOKEN=${RAKAZO_SANDBOX_SUPERVISOR_TOKEN:?RAKAZO_SANDBOX_SUPERVISOR_TOKEN is required}
      - WAKEUP_DRIVER=graphile
      - AGENT_RUNTIME=pi
    volumes:
      - rakazo-app-data:/data
    depends_on:
      rakazo-postgres:
        condition: service_healthy
      rakazo-supervisor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  rakazo-worker:
    image: ${RAKAZO_APP_IMAGE:-ekvaar/rakazo-app:local}
    command: ["tsx", "/app/worker/src/index.ts"]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://rakazo:${RAKAZO_POSTGRES_PASSWORD:?RAKAZO_POSTGRES_PASSWORD is required}@rakazo-postgres:5432/rakazo
      - DATA_DIR=/data
      - BETTER_AUTH_SECRET=${RAKAZO_BETTER_AUTH_SECRET:?RAKAZO_BETTER_AUTH_SECRET is required}
      - ENCRYPTION_KEY=${RAKAZO_ENCRYPTION_KEY:?RAKAZO_ENCRYPTION_KEY is required}
      - SCREEN_PROXY_SECRET=${RAKAZO_SCREEN_PROXY_SECRET:?RAKAZO_SCREEN_PROXY_SECRET is required}
      - SANDBOX_PROVIDER=docker
      - SANDBOX_SUPERVISOR_URL=http://rakazo-supervisor:7091
      - SANDBOX_SUPERVISOR_TOKEN=${RAKAZO_SANDBOX_SUPERVISOR_TOKEN:?RAKAZO_SANDBOX_SUPERVISOR_TOKEN is required}
      - WAKEUP_DRIVER=graphile
      - AGENT_RUNTIME=pi
    volumes:
      - rakazo-app-data:/data
    depends_on:
      rakazo-api:
        condition: service_healthy
      rakazo-supervisor:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  rakazo-web:
    image: ${RAKAZO_APP_IMAGE:-ekvaar/rakazo-app:local}
    command: ["/app/web-runtime/node_modules/.bin/vite", "preview", "--config", "/app/web-runtime/vite.runtime.config.ts"]
    expose:
      - "5173"
    environment:
      - NODE_ENV=production
      - API_PROXY_TARGET=http://rakazo-api:3100
      - RAKAZO_HOST=os.ekvaar.com
      - SCREEN_PROXY_SECRET=${RAKAZO_SCREEN_PROXY_SECRET:?RAKAZO_SCREEN_PROXY_SECRET is required}
    depends_on:
      rakazo-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  omniroute:
    image: diegosouzapw/omniroute:latest
    ports:
      - "20128:20128"
    environment:
      - DATA_DIR=/app/data
      - OMNIROUTE_BASE_URL=http://omniroute:20128/v1
      - PORT=20128
      - DASHBOARD_PORT=20128
      - REDIS_URL=redis://redis:6379
    volumes:
      - omniroutedata:/app/data
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    volumes:
      - ./apps/frontend/storage:/app/storage
      - ./db/supabase-ca.crt:/app/certs/supabase-ca.crt:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must point to Supabase}
      - DIRECT_URL=${DIRECT_URL:?DIRECT_URL must point to the Supabase session pooler}
      - NODE_EXTRA_CA_CERTS=/app/certs/supabase-ca.crt
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://os.ekvaar.com}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://os.ekvaar.com}
      - NEXT_PUBLIC_OS_APP_URL=${NEXT_PUBLIC_OS_APP_URL:-https://os.ekvaar.com/app}
      - NEXT_PUBLIC_MARKETING_URL=${NEXT_PUBLIC_MARKETING_URL:-https://os.ekvaar.com}
      - ARTIFACT_SIGNING_SECRET=${ARTIFACT_SIGNING_SECRET}
      - CAMPAIGN_LAUNCHES_ENABLED=${CAMPAIGN_LAUNCHES_ENABLED:-true}
      - RELEASE_VERSION=${RELEASE_VERSION:-development}
      - OMNIROUTE_BASE_URL=http://omniroute:20128/v1
      - BROWSER_WORKER_KEY=${BROWSER_WORKER_KEY}
      - BROWSER_SIDECAR_URL=${BROWSER_SIDECAR_URL:-http://fastapi:8000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - META_CLIENT_ID=${META_CLIENT_ID}
      - META_CLIENT_SECRET=${META_CLIENT_SECRET}
      - META_GRAPH_VERSION=${META_GRAPH_VERSION:-v25.0}
      - THREADS_CLIENT_ID=${THREADS_CLIENT_ID}
      - THREADS_CLIENT_SECRET=${THREADS_CLIENT_SECRET}
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET}
      - LINKEDIN_API_VERSION=${LINKEDIN_API_VERSION:-202606}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-zai.glm-5}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
      - QIKINK_MODE=${QIKINK_MODE:-sandbox}
      - QIKINK_CLIENT_ID=${QIKINK_CLIENT_ID}
      - QIKINK_CLIENT_SECRET=${QIKINK_CLIENT_SECRET}
      - N8N_EKVAAR_WEBHOOK_URL=${N8N_EKVAAR_WEBHOOK_URL}
      - N8N_EKVAAR_WEBHOOK_SECRET=${N8N_EKVAAR_WEBHOOK_SECRET}
      - N8N_EKVAAR_WORKFLOW_ID=${N8N_EKVAAR_WORKFLOW_ID}
      - N8N_EKVAAR_EDITOR_URL=${N8N_EKVAAR_EDITOR_URL}
      - COGNEE_API_URL=http://cognee:8000
      - DOGRAH_API_URL=${DOGRAH_API_URL:-}
      - GOOGLE_WORKSPACE_CLI_PATH=${GOOGLE_WORKSPACE_CLI_PATH:-gws}
      - OPEN_DESIGN_URL=http://open-design:7456
      - OPEN_DESIGN_PUBLIC_URL=${OPEN_DESIGN_PUBLIC_URL:-}
      - OPEN_DESIGN_API_TOKEN=${OPEN_DESIGN_API_TOKEN}
      - RAKAZO_PUBLIC_URL=${RAKAZO_PUBLIC_URL}
      - UPSKILL_API_URL=http://upskill:8090
      - GOOGLE_WORKSPACE_API_URL=http://google-workspace:8091
      - N8N_INTERNAL_URL=http://n8n:5678
      - N8N_INTERNAL_WEBHOOK_URL=http://n8n:5678/automation/webhook
      - FASTAPI_URL=http://fastapi:8000
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      omniroute:
        condition: service_started
      fastapi:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/workforce/bridge.js:/etc/nginx/workforce-bridge.js:ro
      - /etc/ssl/ekvaar:/etc/ssl/ekvaar:ro
    depends_on:
      - frontend
      - fastapi
      - rakazo-web
    restart: unless-stopped

  fastapi:
    build:
      context: ./apps/backend-py
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must point to Supabase}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-amazon.nova-pro-v1:0}
      - BROWSER_WORKER_KEY=${BROWSER_WORKER_KEY}
      - BROWSER_USE_API_KEY=${BROWSER_USE_API_KEY}
      - BROWSER_USE_MODEL=${BROWSER_USE_MODEL}
      - OPENAI_BROWSER_MODEL=${OPENAI_BROWSER_MODEL}
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-true}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      omniroute:
        condition: service_started

volumes:
  redisdata:
  omniroutedata:
  omniroute-data:
  n8n-data:
  cognee-system:
  cognee-data:
  open-design-data:
  google-workspace-config:
  rakazo-postgres-data:
  rakazo-app-data:
