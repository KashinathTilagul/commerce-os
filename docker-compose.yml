services:
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    volumes:
      - ./apps/frontend/db:/app/db
    environment:
      - DATABASE_URL=file:///app/db/custom.db
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://os.ekvaar.com}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-amazon.nova-pro-v1:0}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
      - QIKINK_MODE=${QIKINK_MODE:-sandbox}
      - QIKINK_CLIENT_ID=${QIKINK_CLIENT_ID}
      - QIKINK_CLIENT_SECRET=${QIKINK_CLIENT_SECRET}
      - BROWSER_WORKER_KEY=${BROWSER_WORKER_KEY}
      - BROWSER_SIDECAR_URL=${BROWSER_SIDECAR_URL}
    restart: unless-stopped
    depends_on:
      - fastapi

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/ekvaar:/etc/ssl/ekvaar:ro
    depends_on:
      - frontend
      - fastapi
    restart: unless-stopped

  fastapi:
    build:
      context: ./apps/backend-py
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-amazon.nova-pro-v1:0}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - BROWSER_WORKER_KEY=${BROWSER_WORKER_KEY}
      - BROWSER_USE_API_KEY=${BROWSER_USE_API_KEY}
      - BROWSER_USE_MODEL=${BROWSER_USE_MODEL}
      - OPENAI_BROWSER_MODEL=${OPENAI_BROWSER_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-true}
    restart: unless-stopped
