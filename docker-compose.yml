services:
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    expose:
      - "3000"
    volumes:
      - ./apps/frontend/storage:/app/storage
      - ./db/supabase-ca.crt:/app/certs/supabase-ca.crt:ro
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must point to Supabase}
      - NODE_EXTRA_CA_CERTS=/app/certs/supabase-ca.crt
      - REDIS_URL=redis://redis:6379
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - CRON_SECRET=${CRON_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-https://os.ekvaar.com}
      - CAMPAIGN_LAUNCHES_ENABLED=${CAMPAIGN_LAUNCHES_ENABLED:-true}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-zai.glm-5}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SPOTIFY_CLIENT_ID=${SPOTIFY_CLIENT_ID}
      - SPOTIFY_CLIENT_SECRET=${SPOTIFY_CLIENT_SECRET}
      - SPOTIFY_REDIRECT_URI=${SPOTIFY_REDIRECT_URI}
      - QIKINK_MODE=${QIKINK_MODE:-sandbox}
      - QIKINK_CLIENT_ID=${QIKINK_CLIENT_ID}
      - QIKINK_CLIENT_SECRET=${QIKINK_CLIENT_SECRET}
      - BROWSER_WORKER_KEY=${BROWSER_WORKER_KEY}
      - BROWSER_SIDECAR_URL=${BROWSER_SIDECAR_URL}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      fastapi:
        condition: service_started

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/ssl/ekvaar:/etc/ssl/ekvaar:ro
    depends_on:
      - frontend
      - fastapi
    restart: unless-stopped

  fastapi:
    build:
      context: ./apps/backend-py
      dockerfile: Dockerfile
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must point to Supabase}
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-amazon.nova-pro-v1:0}
      - AWS_BEARER_TOKEN_BEDROCK=${AWS_BEARER_TOKEN_BEDROCK}
      - COMPOSIO_API_KEY=${COMPOSIO_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - BROWSER_WORKER_KEY=${BROWSER_WORKER_KEY}
      - BROWSER_USE_API_KEY=${BROWSER_USE_API_KEY}
      - BROWSER_USE_MODEL=${BROWSER_USE_MODEL}
      - OPENAI_BROWSER_MODEL=${OPENAI_BROWSER_MODEL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BROWSER_HEADLESS=${BROWSER_HEADLESS:-true}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redisdata:
